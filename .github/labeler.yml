# Label path untuk PR router gratis (.github/workflows/pr-router.yml).
# Labeler tidak pernah menjalankan kode PR; file ini hanya konfigurasi pencocokan path.

scraper:
  - changed-files:
      - any-glob-to-any-file:
          - scrape_*.py
          - ingest_to_dashboard.py
          - sport_classifier.py

data:
  - changed-files:
      - any-glob-to-any-file:
          - "*.csv"

governance:
  - changed-files:
      - any-glob-to-any-file:
          - CLAUDE.md

tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**

deps:
  - changed-files:
      - any-glob-to-any-file:
          - "**/requirements*.txt"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
