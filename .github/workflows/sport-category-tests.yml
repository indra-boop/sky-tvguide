name: Sport Category Tests

on:
  pull_request:
    paths:
      - "sport_classifier.py"
      - "scrape_sky_sports_guide.py"
      - "tests/**"
      - ".github/workflows/sport-category-tests.yml"
  push:
    branches: [main]
    paths:
      - "sport_classifier.py"
      - "scrape_sky_sports_guide.py"
      - "tests/**"
      - ".github/workflows/sport-category-tests.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test sport classification and CSV output
        run: python -m unittest discover -s tests -v
