# Scan keamanan PR gratis (tanpa AI). Menggantikan Cursor Security Agent / Approval Agent.
# Diadaptasi dari indra-boop/jerco-sports-schedule#318.
# Aman untuk fork: hanya pull_request (tidak pernah pull_request_target), tanpa secrets, persist-credentials false.
# Runner: ubuntu-latest (repo publik: gratis, kode fork tidak menyentuh VPS Jerco).
# Aturan: temuan BARU Gitleaks dan Semgrep ERROR = gagal. Temuan lama (Semgrep full scan, Trivy, npm audit, pip-audit) = peringatan saja.
name: PR security (free)

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: pr-security-free-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GITLEAKS_SHA256_ARM64: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256_X64: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
  TRIVY_SHA256_ARM64: "ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3"
  SEMGREP_VERSION: "1.186.0"

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR (no credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned binary + checksum)
        env:
          VERSION: ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) ARCH=x64; WANT_SHA="$GITLEAKS_SHA256_X64" ;;
            aarch64|arm64) ARCH=arm64; WANT_SHA="$GITLEAKS_SHA256_ARM64" ;;
            *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_linux_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" "$URL"
          echo "${WANT_SHA}  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan full PR diff range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # fetch-depth: 0 on the PR merge commit already contains both parents.
          # Do not git fetch after persist-credentials: false.
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          "$RUNNER_TEMP/gitleaks" detect \
            --source=. \
            --redact \
            --verbose \
            --exit-code=1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"

  semgrep:
    name: Semgrep OSS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR (no credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Semgrep OSS in a venv (pinned)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" --version

      - name: Semgrep temuan lama (full scan, warn-only)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          set -uo pipefail
          if "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config p/default \
            --severity ERROR \
            --error \
            --metrics=off \
            --quiet \
            .; then
            echo "Semgrep: tidak ada temuan ERROR di seluruh repo"
          else
            echo "::warning::Semgrep menemukan temuan ERROR yang sudah ada di repo (warn-only; lihat log)."
          fi

      - name: Semgrep temuan baru di PR (fail on ERROR)
        env:
          SEMGREP_SEND_METRICS: "off"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config p/default \
            --severity ERROR \
            --error \
            --metrics=off \
            --quiet \
            --baseline-commit "$BASE_SHA" \
            .

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR (no credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Trivy (pinned binary + checksum)
        env:
          VERSION: ${{ env.TRIVY_VERSION }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) ARCH=64bit; WANT_SHA="$TRIVY_SHA256_X64" ;;
            aarch64|arm64) ARCH=ARM64; WANT_SHA="$TRIVY_SHA256_ARM64" ;;
            *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
          esac
          ARCHIVE="trivy_${VERSION}_Linux-${ARCH}.tar.gz"
          URL="https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/${ARCHIVE}"
          curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" "$URL"
          echo "${WANT_SHA}  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" trivy
          chmod 0755 "$RUNNER_TEMP/trivy"
          "$RUNNER_TEMP/trivy" --version

      - name: Trivy fs (vuln + misconfig + secrets)
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          TRIVY="$RUNNER_TEMP/trivy"
          # Temuan lama (dependensi, misconfig, secret di tree) = warn-only.
          "$TRIVY" fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --no-progress \
            --skip-dirs node_modules,dist,.next,.venv,venv,build \
            .
          echo "::warning::Trivy HIGH/CRITICAL bersifat warn-only (lihat log job)."


  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR (no credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pip-audit in a venv (pinned)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pipaudit-venv"
          "$RUNNER_TEMP/pipaudit-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/pipaudit-venv/bin/pip" install --quiet "pip-audit==2.9.0"

      - name: pip-audit (warn-only)
        run: |
          set -uo pipefail
          audit() {
            echo "== pip-audit $*"
            if timeout 600 "$RUNNER_TEMP/pipaudit-venv/bin/pip-audit" --progress-spinner off "$@"; then
              echo "pip-audit ($*): tidak ada celah yang diketahui"
            else
              echo "::warning::pip-audit ($*) menemukan celah atau gagal resolve dependensi (warn-only; lihat log)."
            fi
          }
          audit -r "requirements.txt"
