name: Daily Sports Schedule Scrape

on:
  schedule:
    # 08:00 WITA (UTC+8) = 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-schedule-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python scrape_sky_sports_guide.py --debug

      - name: Upload diagnostics if scraper fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: debug_artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit CSV if changed
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sports_*.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No CSV was generated; abort commit." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports_*.csv

          if git diff --cached --quiet; then
            echo "No schedule changes to commit."
            exit 0
          fi

          git commit -m "chore: sports schedule sync $(date -u +%F)"
          git push
