name: Daily Sports Schedule Scrape

on:
  schedule:
    # 08:00 WITA (UTC+8) = 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: >-
          Lewati langkah ingest (hanya scrape + commit CSV). Pakai saat
          aggregator sedang maintenance, bukan untuk menyembunyikan error.
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sports-schedule-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DASHBOARD_INGEST_URL: https://schedule.jerconetwork.com/api/ingest/v2
      DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
      MINIMUM_INGEST_ROWS: "150"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ingest configuration
        if: ${{ !inputs.skip_ingest }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DASHBOARD_INGEST_TOKEN:-}" ]; then
            echo "Missing required GitHub secret: DASHBOARD_INGEST_TOKEN" >&2
            exit 1
          fi

      - name: Run scraper
        run: python scrape_sky_sports_guide.py --debug

      - name: Ingest to dashboard aggregator
        if: ${{ !inputs.skip_ingest }}
        run: python ingest_to_dashboard.py

      - name: Upload diagnostics if scraper fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: debug_artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit CSV if changed
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sports_*.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No CSV was generated; abort commit." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports_*.csv

          if git diff --cached --quiet; then
            echo "No schedule changes to commit."
            exit 0
          fi

          git commit -m "chore: sports schedule sync $(date -u +%F)"
          git push

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily Sports Schedule Scrape gagal';
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const body =
              `Run gagal pada ${new Date().toISOString()}.\n\n` +
              `Log: ${runUrl}\n\n` +
              `Cek baris \`Dashboard ingest failure:\` dan \`Row guard:\` di log. ` +
              `Jangan pakai skip_ingest sebelum penyebabnya jelas.`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'sync-failure'
            });
            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['sync-failure']
              });
            }
