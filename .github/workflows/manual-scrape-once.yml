name: Manual Scrape Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-scrape-once.yml'

permissions:
  contents: write

concurrency:
  group: manual-sports-scrape-once
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scraper
        run: python scrape_sky_sports_guide.py --debug

      - name: Commit CSV result
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sports_*.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No CSV generated' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sports_*.csv
          if git diff --cached --quiet; then
            echo 'No CSV changes to commit.'
            exit 0
          fi
          git commit -m "chore: manual sports schedule check $(date -u +%F)"
          git push
